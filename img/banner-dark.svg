<svg width="1120" height="300" viewBox="0 0 1120 300" xmlns="http://www.w3.org/2000/svg" role="img"
  aria-label="Mikel Villota | Software Engineer · Cloud · Big Data · AI | Founder at Beyond Humane">
  <defs>
    <clipPath id="frame">
      <rect width="1120" height="300" rx="24" />
    </clipPath>
    <linearGradient id="pulseGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.15" />
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.9" />
    </linearGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="2.2" result="b" />
      <feMerge>
        <feMergeNode in="b" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <g clip-path="url(#frame)">
