<svg width="1200" height="300" viewBox="0 0 1200 300" xmlns="http://www.w3.org/2000/svg" role="img"
  aria-label="Mikel Villota | Software Engineer · Cloud · Big Data · AI | Founder at Beyond Humane">
  <defs>
    <clipPath id="frame">
      <rect width="1200" height="300" rx="24" />
    </clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1200" height="300" fill="#000000" />

    <!-- Identity -->
    <g transform="translate(90 68)" opacity="0">
      <animate attributeName="opacity" from="0" to="1" dur="1.2s" fill="freeze" />

      <rect y="16" width="5" height="136" rx="2.5" fill="#ffffff" />

      <text x="24" y="62" fill="#ffffff"
        font-family="Inter, Segoe UI, Roboto, Ubuntu, system-ui, sans-serif"
        font-size="56" font-weight="800" letter-spacing="-1">Mikel Villota</text>

      <text x="24" y="109" fill="#ffffff" fill-opacity="0.82"
        font-family="Inter, Segoe UI, Roboto, Ubuntu, system-ui, sans-serif"
        font-size="25" font-weight="600">Software Engineer · Cloud · Big Data · AI</text>

      <text x="24" y="147" fill="#ffffff" fill-opacity="0.5"
        font-family="Inter, Segoe UI, Roboto, Ubuntu, system-ui, sans-serif"
        font-size="18" font-weight="500">Co-Founder @ Beyond Humane</text>
    </g>
  </g>
</svg>
